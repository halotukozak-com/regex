name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Scalafmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Check formatting
        run: scala-cli --power fmt --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - name: Cache scala-cli/Bloop incremental build
        uses: actions/cache@v6
        with:
          path: .scala-build
          key: scala-build-jvm-${{ hashFiles('project.scala', '**/*.scala') }}
          restore-keys: |
            scala-build-jvm-
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run tests
        # Coverage is recorded only for production sources; tests were previously
        # measured as 100%-covered and inflated the reported number. bench/ is excluded
        # because it only compiles under `--jmh` (see the benchmark job below); scripts/ is
        # excluded because it's one-off codegen (see scripts/GenUnicodeCategories.scala) that
        # calls JVM-only APIs the library's own sources may never depend on, and would
        # otherwise skew the coverage percentage since nothing exercises it in tests.
        run: >
          scala-cli --power test . --exclude "bench/**" --exclude "scripts/**"
          -O -coverage-out:./.scoverage -O '-coverage-exclude-files:.*test/.*'
      - name: Generate coverage
        run: scala-cli .scoverage/report.sc
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          files: .scoverage/report/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Test documentation
        run: scala-cli --power doc . --exclude "bench/**" --exclude "scripts/**"

  compile:
    name: Compile (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            args: ""
          - platform: scala-js
            args: "--js-version 1.22.0"
          - platform: scala-native
            args: "--native-version 0.5.12"
    steps:
      - uses: actions/checkout@v7
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - name: Cache scala-cli/Bloop incremental build
        uses: actions/cache@v6
        with:
          path: .scala-build
          key: scala-build-${{ matrix.platform }}-${{ hashFiles('project.scala', '**/*.scala') }}
          restore-keys: |
            scala-build-${{ matrix.platform }}-
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Compile
        run: >
          scala-cli --power compile . --exclude "bench/**" --exclude "scripts/**"
          --platform ${{ matrix.platform }} ${{ matrix.args }}

  # JVM is covered by the `test` job above (with coverage/docs); this just runs
  # the same suite on the other targets to catch platform-specific regressions.
  test-cross-platform:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: scala-js
            args: "--js-version 1.22.0"
          - platform: scala-native
            args: "--native-version 0.5.12"
    steps:
      - uses: actions/checkout@v7
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - name: Cache scala-cli/Bloop incremental build
        uses: actions/cache@v6
        with:
          path: .scala-build
          key: scala-build-${{ matrix.platform }}-${{ hashFiles('project.scala', '**/*.scala') }}
          restore-keys: |
            scala-build-${{ matrix.platform }}-
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run tests
        run: >
          scala-cli --power test . --exclude "bench/**" --exclude "scripts/**"
          --platform ${{ matrix.platform }} ${{ matrix.args }}

  # Runs the JMH suite in bench/ against both the PR branch and main, on the same runner
  # back-to-back, then diffs the two result sets. Informational only (see the note the
  # compare script prints) — a shared CI runner is too noisy to gate merges on.
  benchmark:
    name: Benchmark (current vs main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup coursier cache
        uses: coursier/cache-action@v8.1
      - uses: VirtusLab/scala-cli-setup@v1
      - name: Run benchmarks on current branch
        run: >
          scala-cli --power run --jmh . --exclude "test/**" --exclude "scripts/**" --
          -f 1 -wi 3 -i 5 -w 300ms -r 300ms -rf json -rff "$GITHUB_WORKSPACE/current-bench.json"
      - name: Run benchmarks on main
        # Reuses the PR's bench/ harness (and project.scala, for identical compiler
        # settings) against main's library sources, so only regex/ actually differs -
        # *except* when the PR itself changes an API its own bench/ exercises (a new
        # benchmark for new functionality, a changed signature for a perf change): main
        # doesn't have that change yet, so this step's compile can legitimately fail.
        # That's not a bug in the PR, just this comparison being inapplicable to it -
        # continue-on-error keeps that non-fatal, matching this job's informational-only
        # status; Compare below degrades to current-branch-only numbers when it happens.
        continue-on-error: true
        run: |
          git worktree add /tmp/main-baseline origin/main
          rm -rf /tmp/main-baseline/bench
          cp -r bench /tmp/main-baseline/bench
          cp project.scala /tmp/main-baseline/project.scala
          cd /tmp/main-baseline
          scala-cli --power run --jmh . --exclude "test/**" --exclude "scripts/**" -- \
            -f 1 -wi 3 -i 5 -w 300ms -r 300ms -rf json -rff "$GITHUB_WORKSPACE/main-bench.json"
      - name: Compare
        run: |
          python3 .github/scripts/compare_benchmarks.py main-bench.json current-bench.json | tee comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: benchmark
          path: comparison.md
