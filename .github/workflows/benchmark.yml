name: Benchmark

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# JMH suite in bench/ against the PR branch and against main, back-to-back on
# the same runner, then diffed. Informational only — a shared runner is too
# noisy to gate merges on, so this is a separate workflow from the shared
# `test` job and never required.
jobs:
  benchmark:
    name: Benchmark (current vs main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache Mill dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Benchmark the PR branch
        run: >
          ./mill bench.runJmh
          '.*' -f 1 -wi 3 -i 5 -w 300ms -r 300ms -rf json -rff "$GITHUB_WORKSPACE/current-bench.json"
      - name: Benchmark main
        # Reuses the PR's bench/ sources against main's library — so only src/
        # actually differs, except when the PR changes an API its own bench/
        # exercises (then main's compile legitimately fails; the compare step
        # below degrades to current-branch-only).
        continue-on-error: true
        run: |
          git worktree add /tmp/main-baseline origin/main
          rm -rf /tmp/main-baseline/bench
          cp -r bench /tmp/main-baseline/bench
          cd /tmp/main-baseline
          ./mill bench.runJmh \
            '.*' -f 1 -wi 3 -i 5 -w 300ms -r 300ms -rf json -rff "$GITHUB_WORKSPACE/main-bench.json"
      - name: Compare
        run: |
          python3 .github/scripts/compare_benchmarks.py main-bench.json current-bench.json | tee comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: benchmark
          path: comparison.md
